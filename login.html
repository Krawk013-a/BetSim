<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InimigosBet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1e1e2e, #2a2a40);
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            background-color: rgba(20, 20, 35, 0.8);
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo h1 {
            color: #4CAF50;
            font-size: 36px;
            font-weight: 700;
        }
        
        .logo span {
            color: #FFC107;
        }
        
        .disclaimer {
            text-align: center;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 20px;
            padding: 5px;
            background-color: rgba(255, 193, 7, 0.2);
            border-radius: 5px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #ddd;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: none;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            background-color: rgba(255, 255, 255, 0.2);
        }
        
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background-color: #4CAF50;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn:hover {
            background-color: #45a049;
            transform: translateY(-2px);
        }
        
        .create-account {
            margin-top: 20px;
            text-align: center;
            color: #ddd;
        }
        
        .create-account a {
            color: #FFC107;
            text-decoration: none;
        }
        
        .create-account a:hover {
            text-decoration: underline;
        }
        
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background-color: #2a2a40;
            padding: 20px;
            border-radius: 10px;
            width: 80%;
            max-width: 400px;
            text-align: center;
        }
        
        .modal-content h2 {
            margin-bottom: 20px;
            color: #FFC107;
        }
        
        .modal-btn {
            padding: 10px 20px;
            margin-top: 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>Inimigos<span>Bet</span></h1>
        </div>
        
        <div class="disclaimer">
            <p>Este é um simulador para fins acadêmicos - Sobre legalização das casas de apostas.</p>
        </div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Nome de usuário</label>
                <input type="text" id="username" required>
            </div>
            
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" required>
            </div>
            
            <button type="submit" class="btn">Entrar</button>
        </form>
        
        <div class="create-account">
            <p>Não tem uma conta? <a href="#" id="registerLink">Cadastre-se</a></p>
        </div>
    </div>
    
    <div id="successModal" class="modal">
        <div class="modal-content">
            <h2>Login realizado com sucesso!</h2>
            <p>Você será redirecionado para a página principal.</p>
            <button class="modal-btn" id="continueBtn">Continuar</button>
        </div>
    </div>

    <script>
        (function() {
            const form = document.getElementById('loginForm');
            const submitBtn = form.querySelector('button[type="submit"]');
            const registerLink = document.getElementById('registerLink');
            const successModal = document.getElementById('successModal');
            const continueBtn = document.getElementById('continueBtn');
            let isRegisterMode = false;

            function ensureSessionId() {
                if (!localStorage.getItem('sessionId')) {
                    const sid = 'sess-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10);
                    localStorage.setItem('sessionId', sid);
                }
            }

            async function api(path, method, body) {
                const res = await fetch(path, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body || {})
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    throw new Error(data.message || 'Erro de conexão');
                }
                return data;
            }

            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value.trim();
                if (!username || !password) { alert('Preencha usuário e senha.'); return; }

                try {
                    submitBtn.disabled = true;
                    ensureSessionId();
                    if (isRegisterMode) {
                        await api('/api/register', 'POST', { username, password });
                    }
                    const login = await api('/api/login', 'POST', { username, password });
                    localStorage.setItem('authToken', login.token);
                    localStorage.setItem('currentUser', login.user.username);
                    localStorage.setItem('userBalance', String(login.user.balance || 0));
                    successModal.style.display = 'flex';
                } catch (err) {
                    alert(err.message);
                } finally {
                    submitBtn.disabled = false;
                }
            });
            
            continueBtn.addEventListener('click', function() {
                window.location.href = 'dashboard.html';
            });
            
            registerLink.addEventListener('click', function(e) {
                e.preventDefault();
                isRegisterMode = !isRegisterMode;
                submitBtn.textContent = isRegisterMode ? 'Cadastrar' : 'Entrar';
                registerLink.textContent = isRegisterMode ? 'Já tem uma conta? Entrar' : 'Cadastre-se';
            });
        })();
    </script>
</body>
</html>
